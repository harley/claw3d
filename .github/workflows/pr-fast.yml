name: PR fast lane

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    # Titles are checked on the PR; a skipped job satisfies the required check inside the merge queue.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: Use an imperative, lower-case summary; it becomes the release-note line.

  unit:
    name: Unit tests and build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Bundle report
        run: |
          echo '## Bundle' >> "$GITHUB_STEP_SUMMARY"
          echo '| asset | bytes | gzip |' >> "$GITHUB_STEP_SUMMARY"; echo '|---|---:|---:|' >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.js dist/assets/*.css; do echo "| $(basename "$f") | $(wc -c < "$f" | tr -d ' ') | $(gzip -c "$f" | wc -c | tr -d ' ') |" >> "$GITHUB_STEP_SUMMARY"; done

name: Offline lifecycle diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: Focused offline lifecycle
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 4076a2627085149cbf357f2ea2fa0474904f3529
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact uninstrumented source
        run: |
          test "$(git rev-parse HEAD)" = 4076a2627085149cbf357f2ea2fa0474904f3529
          git rev-parse HEAD
          test -z "$(git status --porcelain)"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: node tests/offline-station.browser.mjs

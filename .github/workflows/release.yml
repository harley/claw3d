name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue validates one merged group of PRs per run before it lands on main.
  merge_group:
  workflow_dispatch:
    inputs:
      camera_diagnostic:
        description: Compare PR 100 and its base on one macOS runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests and build (macOS)
    if: ${{ !inputs.camera_diagnostic }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    name: Browser suites (${{ matrix.shard }})
    if: ${{ !inputs.camera_diagnostic }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [shard-1, shard-2, shard-3, shard-4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node scripts/check-browser.mjs --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: synthetic-browser-failure-${{ github.run_id }}-${{ matrix.shard }}
          path: .screenshots/
          include-hidden-files: true
          retention-days: 7

  shared:
    name: Shared-session browser check
    if: ${{ !inputs.camera_diagnostic }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:shared
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: synthetic-shared-browser-failure-${{ github.run_id }}
          path: .screenshots/
          include-hidden-files: true
          retention-days: 7

  check:
    name: Unit, build and browser checks
    needs: [unit, browser, shared]
    if: ${{ always() && !inputs.camera_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every unit, browser and shared check
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SHARED_RESULT: ${{ needs.shared.result }}
        run: |
          failed=0
          for check in "unit:$UNIT_RESULT" "browser:$BROWSER_RESULT" "shared:$SHARED_RESULT"; do
            name=${check%%:*}
            result=${check#*:}
            echo "$name: $result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != success ]]; then
              echo "::error::$name check did not succeed ($result)."
              failed=1
            fi
          done
          exit "$failed"

  container:
    name: Production Linux container and backup checks
    if: ${{ !inputs.camera_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check-release-container.sh

  camera_diagnostic:
    name: Compare camera lifecycle on PR 100 and base
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.camera_diagnostic }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7373b71ba2c9acd852f62ba7d02a7c6158f770c4
          path: cases/base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 398da0f1e65530ce1740215f652cdd2545f13c68
          path: cases/pr
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --prefix cases/base && npm ci --prefix cases/pr
      - run: npx playwright install chromium
        working-directory: cases/base
      - run: node scripts/compare-camera-ci.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: camera-comparison-${{ github.run_id }}
          path: .screenshots/camera-ci-comparison/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy and verify live BUILD
    needs: [check, container]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    # Never cancel an upload already in progress. One production writer at a time.
    concurrency:
      group: cloud-claw-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://claw.coderpush.com
    env:
      RAILWAY_PROJECT_ID: 6c39fc46-faaa-49e5-8c81-784a4d95e12d
      RAILWAY_ENVIRONMENT_ID: 2a739b9f-1ada-43c9-ad22-67680a5bb470
      RAILWAY_SERVICE_ID: 6cd4794a-0ef1-4de5-9d1c-4d099d9aa2ad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm install --global @railway/cli@5.44.0
      - run: npx playwright install chromium
      # Deploy when this commit is newer than the live build. An older run that
      # finishes after a newer deploy is skipped; a newer commit is never skipped
      # merely because another one merged while its checks were running.
      - name: Compare with the live build
        id: head
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bash scripts/deploy-if-newer.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Recheck the live build immediately before production mutation
        id: release
        if: steps.head.outputs.current == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bash scripts/deploy-if-newer.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Set exact build identity without triggering a separate deployment
        if: steps.release.outputs.current == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          test -n "$RAILWAY_TOKEN"
          railway variable set --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" --skip-deploys "BUILD_COMMIT=$GITHUB_SHA" BUILD_BRANCH=main BUILD_DIRTY=false
      - name: Deploy checked source
        if: steps.release.outputs.current == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" --ci --message "main $GITHUB_SHA (GitHub run $GITHUB_RUN_ID)"
      - name: Verify protected BUILD and rendered operator panel
        if: steps.release.outputs.current == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          EXPECTED_BUILD: ${{ github.sha }}
        run: node scripts/verify-release.mjs
      - name: Publish production release notes
        if: steps.release.outputs.current == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA::7}; stamp=$(date -u +%Y%m%d-%H%M)
          tag="prod-$stamp-$short"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Production $stamp · $short" --generate-notes --latest
          echo "## Release notes" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json body --jq .body >> "$GITHUB_STEP_SUMMARY"
      - name: Report release failure
        if: failure()
        run: |
          echo "::error::Release failed. Check the live BUILD before retrying; an uploaded deployment may still be running. Do not reset the database."
          echo "Release failed. Inspect this run and Railway; verify live BUILD before retrying or rolling back to a compatible deployment. The database is preserved." >> "$GITHUB_STEP_SUMMARY"
